<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 학습 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
  /* Layout: 퀴즈를 고르는 한 장짜리 목록. 카드 색은 각 퀴즈 페이지의 대표 색을 따른다. */
  :root {
    --bg: #f1f4f8;
    --paper: #ffffff;
    --fg: #1f2a3d;
    --muted: #5a6880;
    --line: #c9d3e2;
    --idiom: #1c6b57;
    --idiom-soft: #ddefe7;
    --time: #2c63c9;
    --time-soft: #dfe9fb;
    --focus: #ffc23a;
    --display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131a26;
      --paper: #1c2535;
      --fg: #edf1f8;
      --muted: #a8b4c9;
      --line: #364460;
      --idiom: #6fd2b2;
      --idiom-soft: #22423a;
      --time: #7fa8f5;
      --time-soft: #26375b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131a26;
    --paper: #1c2535;
    --fg: #edf1f8;
    --muted: #a8b4c9;
    --line: #364460;
    --idiom: #6fd2b2;
    --idiom-soft: #22423a;
    --time: #7fa8f5;
    --time-soft: #26375b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 19px;
    line-height: 1.65;
    word-break: keep-all;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 40px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  header { display: flex; flex-direction: column; gap: 8px; }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 9vw, 48px); line-height: 1.2; }
  header p { margin: 0; color: var(--muted); }

  .quizzes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .quiz {
    --tone: var(--idiom);
    --tone-soft: var(--idiom-soft);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 22px;
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 16px;
    color: inherit;
    text-decoration: none;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .quiz.time { --tone: var(--time); --tone-soft: var(--time-soft); }
  .quiz:hover { border-color: var(--tone); transform: translateY(-3px); }
  .quiz:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .grade {
    align-self: flex-start;
    padding: 2px 12px;
    border-radius: 999px;
    background: var(--tone-soft);
    color: var(--tone);
    font-family: var(--display);
    font-size: 16px;
  }
  .quiz h2 { font-size: 28px; line-height: 1.3; color: var(--tone); }
  .quiz p { margin: 0; }
  .meta { color: var(--muted); font-size: 16px; }
  .go {
    margin-top: auto;
    font-family: var(--display);
    font-size: 20px;
    color: var(--tone);
  }

  @media (prefers-reduced-motion: reduce) {
    .quiz { transition: none; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>우리 반 학습 퀴즈</h1>
    <p>풀고 싶은 퀴즈를 눌러 시작하세요. 퀴즈마다 4지 선다형 5문제가 나오고, 100점 만점으로 채점돼요.</p>
  </header>

  <div class="quizzes">
    <a class="quiz idiom" href="idiom-quiz.html">
      <span class="grade">6학년 국어</span>
      <h2>관용표현 탐험대</h2>
      <p>'발이 넓다', '귀가 얇다'처럼 글자와 다른 숨은 뜻을 찾아봐요.</p>
      <p class="meta">5문제 · 문제당 20점 · 약 5분</p>
      <span class="go">퀴즈 풀러 가기 →</span>
    </a>
    <a class="quiz time" href="time-quiz.html">
      <span class="grade">2학년 수학</span>
      <h2>똑딱똑딱 시계 탐험</h2>
      <p>시계를 보고 시각을 읽고, 걸린 시간을 알아봐요.</p>
      <p class="meta">5문제 · 문제당 20점 · 약 5~7분</p>
      <span class="go">퀴즈 풀러 가기 →</span>
    </a>
  </div>
</main>
</body>
</html>
